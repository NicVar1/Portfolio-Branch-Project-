<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolios</title>
  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* Fondo animado */
    .background {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(125% 125% at 50% 10%, #000 40%, #63e 100%);
      animation: moveBg 20s linear infinite;
    }

    @keyframes moveBg {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 100%; }
    }

    /* Contenedor central */
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 50px 70px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      max-width: 500px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 40px;
      font-weight: 700;
      color: #f0f0f0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    /* Botones futuristas con efecto neón */
    .btn {
      display: block;
      margin: 15px auto;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4), 0 0 10px rgba(97, 63, 255, 0.5);
    }

    .btn:hover {
      transform: translateY(-6px) scale(1.05);
      background: linear-gradient(135deg, #2575fc, #6a11cb);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(97, 63, 255, 0.7);
    }

    /* Responsividad */
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }
      h1 {
        font-size: 2rem;
      }
      .btn {
        padding: 14px 24px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Fondo animado -->
  <div class="background"></div>

  <!-- Contenedor principal -->
  <div class="container">
    <h1>Explora los portafolios</h1>

    <a href="https://chipper-sprinkles-008a9a.netlify.app/" class="btn" target="_blank">Portafolio Will Higuera</a>
    <a href="https://charming-flan-d6e496.netlify.app" class="btn" target="_blank">Portafolio Andrés Gómez</a>
    <a href="https://nicolasotero-portfolio.netlify.app/" class="btn" target="_blank">Portafolio Nicolas Otero</a>
  </div>
</body>
</html>
